name: Build and push
on:
   push:
        branches:[main]
jobs:
     Build and push
       runs-on: ubuntu-latest
     steps:
       -name: checkout role
       uses:  actions/checkout@v3
       -name: log in to dockerhub
       uses: docker/login-action@v3
       with:
            username: ${{secrets DOCKERHUBUSERNAME}}
            password: ${{secrets DOCKERHUBPASSWORD}}
      -name: Build the image
       run: docker build -t ${{secrets DOCKERHUBUSERNAME}}/python-app: latest
      -name: push the image
       run: docker push ${{Secret DOCKERHUBUSERNAME}}/python-app: latest   
